name: Materialize and validate learning project
on:
  push:
    paths:
      - '.github/workflows/initialize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore authored source files
        shell: python
        run: |
          import base64, gzip, json, pathlib
          payload = ""
          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          root = pathlib.Path.cwd()
          for name, content in files.items():
              path = root / name
              if not path.resolve().is_relative_to(root.resolve()):
                  raise ValueError(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
      - name: Build and validate
        run: |
          python3 scripts/build.py
          python3 scripts/validate.py
          node --check assets/app.js
      - name: Commit complete source and website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Publish complete notes source, templates, rules and verified website"
          git push
